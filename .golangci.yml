version: "2"
run:
  # Loading this module's packages pulls in the whole dd-trace-go dependency
  # tree, which does not fit in the default timeout on a cold cache.
  timeout: 10m
  build-tags:
    - e2e
linters:
  enable:
    - errorlint
    - godot
    - gosec
    - misspell
    - revive
    - funcorder
    - modernize
  settings:
    errcheck:
      check-type-assertions: true
    misspell:
      locale: US
    revive:
      rules:
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
