name: trivy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  job-trivy:
    name: Run trivy for license check
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Only licenses. Go vulnerabilities are govulncheck's job in the build
      # workflow, and it reports whether the vulnerable code is actually called.
      #
      # MPL-2.0 is accepted. It reaches ddflagd as github.com/hashicorp/go-version,
      # transitively through dd-trace-go, and its reciprocity is per file: a
      # binary that links it may be distributed, and the obligation is to publish
      # modifications to the MPL licensed files themselves, which ddflagd makes
      # none of. It is named rather than waved through by dropping MEDIUM from the
      # severity list, so that any other reciprocal license still fails the build.
      - name: Run trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_IGNORED_LICENSES: MPL-2.0
        with:
          scan-type: 'fs'
          scanners: 'license'
          target: '.'
          format: 'table'
          exit-code: '1'
          severity: 'UNKNOWN,MEDIUM,HIGH'
